[project]
name = "sdg15-life-on-land"
version = "0.1.0"
description = "Visualizing UN Sustainable Development Goal 15 (Life on Land)"
authors = [
    { name = "Vikke Savola", email = "vikke.savola@aalto.fi" }
]
requires-python = ">=3.13"
dependencies = [
    "adjusttext>=1.4.0",
    "countryinfo>=1.0.1",
    "jupyterlab>=4.5.5",
    "kaleido>=1.3.0",
    "matplotlib>=3.10.8",
    "networkx>=3.6.1",
    "numpy>=2.4.2",
    "pandas>=3.0.1",
    "plotly>=7.0.0",
    "scikit-learn>=1.8.0",
    "scipy>=1.17.1",
    "seaborn>=0.13.2",
]

[tool.uv]
package = false
